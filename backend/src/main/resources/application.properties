server.port=8080

# Configuración de Conexión a Base de Datos Sakila (MySQL / MariaDB en XAMPP puerto 3306)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sakila?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JasperReports
reports.path=classpath:reports/

# Logging
logging.level.com.example.jasperdemo=DEBUG
logging.level.org.springframework.jdbc.core=INFO
